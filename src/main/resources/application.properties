server.port=${PORT:8080}
server.error.include-message=always

spring.application.name=mygia-bus-reservation

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mygia_bus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Abiramy@23}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SMTP is NOT configured here. EmailService builds JavaMailSenderImpl from SystemSetting at runtime.

app.jwt.secret=${JWT_SECRET:change-this-to-a-256-bit-secret-key-for-production-use-only!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

logging.level.com.mygia.bus=INFO
logging.level.org.springframework.security=WARN
